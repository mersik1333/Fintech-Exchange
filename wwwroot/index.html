<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Учебная биржа</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --panel: #171a23;
            --panel-2: #1e222d;
            --border: #2a2f3d;
            --text: #e6e8ee;
            --muted: #8a90a2;
            --green: #16c784;
            --red: #ea3943;
            --accent: #4f7cff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            font-size: 14px;
        }

        .app {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 16px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: .3px;
        }

            h1 span {
                color: var(--accent);
            }

        .reset-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

            .reset-btn:hover {
                color: var(--text);
                border-color: var(--accent);
            }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
        }

            .card .label {
                color: var(--muted);
                font-size: 12px;
                margin-bottom: 6px;
            }

            .card .value {
                font-size: 22px;
                font-weight: 600;
            }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
        }

        @media (max-width: 960px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

            .panel h2 {
                margin: 0;
                padding: 14px 16px;
                font-size: 14px;
                text-transform: uppercase;
                letter-spacing: .8px;
                color: var(--muted);
                border-bottom: 1px solid var(--border);
            }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--muted);
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .sym {
            font-weight: 700;
        }

        .name {
            color: var(--muted);
            font-size: 12px;
        }

        .price {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        .up {
            color: var(--green);
            font-variant-numeric: tabular-nums;
        }

        .down {
            color: var(--red);
            font-variant-numeric: tabular-nums;
        }

        .qty {
            width: 70px;
            padding: 6px 8px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
        }

        .actions button {
            padding: 6px 10px;
            margin-right: 6px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        .buy {
            background: var(--green);
            color: #06120c;
        }

            .buy:hover {
                filter: brightness(1.1);
            }

        .sell {
            background: var(--red);
            color: #fff;
        }

            .sell:hover {
                filter: brightness(1.1);
            }

        .right {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .empty {
            padding: 20px 16px;
            color: var(--muted);
            text-align: center;
        }

        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-2);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 10px;
            opacity: 0;
            transition: opacity .25s;
            pointer-events: none;
            z-index: 10;
        }

            #toast.show {
                opacity: 1;
            }

            #toast.err {
                border-color: var(--red);
                color: #ffb3b8;
            }

            #toast.ok {
                border-color: var(--green);
                color: #b8f0d6;
            }

        .stock-row:hover {
            background-color: rgba(255,255,255, 0.05);
        }

        .chart-header {
            padding: 0;
            border: none;
            margin-bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>📈 Учебная <span>биржа</span></h1>
            <button class="reset-btn" onclick="resetAll()">Сбросить счёт</button>
        </header>

        <div class="stats">
            <div class="card"><div class="label">Наличные</div><div class="value" id="cash">—</div></div>
            <div class="card"><div class="label">Портфель</div><div class="value" id="portfolio">—</div></div>
            <div class="card"><div class="label">Итого</div><div class="value" id="total">—</div></div>
            <div class="card"><div class="label">P/L (к старту)</div><div class="value" id="profit">—</div></div>
        </div>

        <div class="grid">
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <!-- ЛЕВЫЙ ГРАФИК -->
                <div class="panel" style="padding: 16px;">
                    <h2 id="chartTitle" class="chart-header">График: GAZP</h2>
                    <div style="height: 200px; width: 100%;"><canvas id="priceChart"></canvas></div>
                </div>
                <div class="panel">
                    <h2>Рынок</h2>
                    <table>
                        <thead><tr><th>Акция</th><th>Цена</th><th>Δ</th><th>Кол-во</th><th>Действия</th></tr></thead>
                        <tbody id="stocksBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="right">
                <!-- ПРАВЫЙ ГРАФИК -->
                <div class="panel" style="padding: 16px;">
                    <h2 class="chart-header">График портфеля</h2>
                    <div style="height: 200px; width: 100%;"><canvas id="portfolioChart"></canvas></div>
                </div>
                <div class="panel">
                    <h2>Портфель</h2>
                    <table><tbody id="holdingsBody"></tbody></table>
                </div>
                <div class="panel">
                    <h2>История сделок</h2>
                    <table><tbody id="historyBody"></tbody></table>
                </div>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
const fmt = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let initialized = false;

// Функция для генерации меток времени (шаг 2 секунды, как на бэкенде)
function generateTimeLabels(length) {
            const labels = [];
            const now = Date.now();
            const step = 2000; // 2 секунды
            for (let i = length - 1; i >= 0; i--) {
                const time = new Date(now - i * step);
                labels.push(time.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
            }
            return labels;
}

async function fetchState() {
          try {
            const r = await fetch('/api/state');
            const s = await r.json();
            render(s);
          } catch (e) { console.error(e); }
}

function render(s) {
          document.getElementById('cash').textContent = fmt.format(s.cash) + ' ₽';
          document.getElementById('portfolio').textContent = fmt.format(s.portfolioValue) + ' ₽';
          document.getElementById('total').textContent = fmt.format(s.total) + ' ₽';

          const p = document.getElementById('profit');
          p.textContent = (s.profit >= 0 ? '+' : '') + fmt.format(s.profit) + ' ₽';
          p.style.color = s.profit >= 0 ? 'var(--green)' : 'var(--red)';

          if (!initialized) { buildStocks(s); initialized = true; }
          updateStocks(s);
          renderHoldings(s.holdings);
          renderHistory(s.history);

          updateChart(s);
          updatePortfolioChart(s);
}

function buildStocks(s) {
            document.getElementById('stocksBody').innerHTML = s.stocks.map(st => `
             <tr style="cursor: pointer;" onclick="selectStock('${st.symbol}')" class="stock-row">
              <td><div class="sym">${st.symbol}</div><div class="name">${st.name}</div></td>
              <td class="price" id="price-${st.symbol}"></td>
              <td id="chg-${st.symbol}"></td>
              <td><input type="number" min="1" value="1" id="qty-${st.symbol}" class="qty" onclick="event.stopPropagation()"></td>
              <td class="actions" onclick="event.stopPropagation()">
                <button class="buy" onclick="trade('buy','${st.symbol}', 'qty-${st.symbol}')">Купить</button>
              </td>
            </tr>`).join('');
}

function updateStocks(s) {
          for (const st of s.stocks) {
            document.getElementById('price-' + st.symbol).textContent = fmt.format(st.price) + ' ₽';
            const chg = st.prevPrice ? ((st.price - st.prevPrice) / st.prevPrice) * 100 : 0;
            const el = document.getElementById('chg-' + st.symbol);
            el.textContent = (chg >= 0 ? '▲ +' : '▼ ') + chg.toFixed(2) + '%';
            el.className = chg >= 0 ? 'up' : 'down';
          }
}

function renderHoldings(h) {
            const tb = document.getElementById('holdingsBody');
            if (!h || h.length === 0) {
                tb.innerHTML = '<tr><td colspan="4" class="empty">Нет активов</td></tr>';
                return;
            }
            tb.innerHTML = h.map(x => `
            <tr>
              <td><div class="sym">${x.symbol}</div><div class="name">${x.quantity} шт.</div></td>
              <td class="price">${fmt.format(x.value)} ₽</td>
              <td class="${x.profit >= 0 ? 'up' : 'down'}">${(x.profit >= 0 ? '+' : '') + fmt.format(x.profit)}</td>
              <td class="actions" style="text-align: right;">
                <div style="display: flex; gap: 6px; justify-content: flex-end; align-items: center;">
                  <input type="number" min="1" max="${x.quantity}" value="1" id="sell-qty-${x.symbol}" class="qty" style="width: 60px;">
                  <button class="sell" onclick="trade('sell', '${x.symbol}', 'sell-qty-${x.symbol}')">Продать</button>
                </div>
              </td>
            </tr>`).join('');
}

function renderHistory(h) {
          const tb = document.getElementById('historyBody');
          if (!h || h.length === 0) {
            tb.innerHTML = '<tr><td class="empty">Сделок нет</td></tr>';
            return;
          }
          tb.innerHTML = h.map(t => `
            <tr>
              <td><span style="color:${t.side === 'BUY' ? 'var(--green)' : 'var(--red)'};font-weight:700">${t.side === 'BUY' ? 'Покупка' : 'Продажа'}</span></td>
              <td>${t.symbol} × ${t.qty}</td>
              <td class="price">${fmt.format(t.price)} ₽</td>
              <td class="name">${t.time}</td>
            </tr>`).join('');
}

async function trade(side, symbol, inputId) {
          const idToUse = inputId ? inputId : 'qty-' + symbol;
          const qty = parseInt(document.getElementById(idToUse).value, 10);
          if (!qty || qty <= 0) { toast('Укажите корректное количество', false); return; }

          const r = await fetch('/api/' + side, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ symbol, quantity: qty })
          });
          const res = await r.json();
          if (res.ok) toast(side === 'buy' ? 'Куплено ✔' : 'Продано ✔', true);
          else toast(res.error || 'Ошибка', false);
          fetchState();
}

async function resetAll() {
          if (!confirm('Сбросить счёт до 100 000 ₽?')) return;
          await fetch('/api/reset', { method: 'POST' });
          fetchState();
}

let toastTimer;
function toast(msg, ok) {
          const el = document.getElementById('toast');
          el.textContent = msg;
          el.className = 'show ' + (ok ? 'ok' : 'err');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => el.className = '', 2000);
}

let chartInstance = null;
let currentSymbol = 'GAZP';

function selectStock(symbol) {
            currentSymbol = symbol;
            document.getElementById('chartTitle').textContent = 'График: ' + symbol;
}

function updateChart(s) {
            const stock = s.stocks.find(x => x.symbol === currentSymbol);
            if (!stock || !stock.history) return;

            const labels = generateTimeLabels(stock.history.length); // Генерируем метки времени
            const data = stock.history;
            const isUp = data[data.length - 1] >= data[0];
            const lineColor = isUp ? '#16c784' : '#ea3943';

            if (!chartInstance) {
                const ctx = document.getElementById('priceChart').getContext('2d');
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: { labels: labels, datasets: [{ label: 'Цена (₽)', data: data, borderColor: lineColor, borderWidth: 2, pointRadius: 0, tension: 0.2, fill: false }] },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            // ВКЛЮЧАЕМ ОСЬ X И НАСТРАИВАЕМ ЕЕ
                            x: {
                                display: true,
                                grid: { color: '#2a2f3d' },
                                ticks: { color: '#8a90a2', maxTicksLimit: 6, maxRotation: 0 }
                            },
                            y: { grid: { color: '#2a2f3d' }, ticks: { color: '#8a90a2' } }
                        }
                    }
                });
            } else {
                chartInstance.data.labels = labels;
                chartInstance.data.datasets[0].data = data;
                chartInstance.data.datasets[0].borderColor = lineColor;
                chartInstance.update();
            }
}

let portfolioChartInstance = null;

function updatePortfolioChart(s) {
            if (!s.portfolioValueHistory) return;

            const labels = generateTimeLabels(s.portfolioValueHistory.length); // Генерируем метки времени
            const data = s.portfolioValueHistory;

            let lineColor = '#16c784';
            if (data.length > 0) {
                lineColor = data[data.length - 1] >= data[0] ? '#16c784' : '#ea3943';
            }

            if (!portfolioChartInstance) {
                const ctx = document.getElementById('portfolioChart').getContext('2d');
                portfolioChartInstance = new Chart(ctx, {
                    type: 'line',
                    data: { labels: labels, datasets: [{ label: 'Портфель (₽)', data: data, borderColor: lineColor, borderWidth: 2, pointRadius: 0, tension: 0.2, fill: false }] },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            // ВКЛЮЧАЕМ ОСЬ X И НАСТРАИВАЕМ ЕЕ
                            x: {
                                display: true,
                                grid: { color: '#2a2f3d' },
                                ticks: { color: '#8a90a2', maxTicksLimit: 4, maxRotation: 0 }
                            },
                            y: { grid: { color: '#2a2f3d' }, ticks: { color: '#8a90a2' } }
                        }
                    }
                });
            } else {
                portfolioChartInstance.data.labels = labels;
                portfolioChartInstance.data.datasets[0].data = data;
                portfolioChartInstance.data.datasets[0].borderColor = lineColor;
                portfolioChartInstance.update();
            }
}

fetchState();
setInterval(fetchState, 1000);
    </script>
</body>
</html>
